name: Build & Release Speed Camera APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools and platform
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Install Kotlin compiler
        run: |
          sudo snap install kotlin --classic || \
          (sudo apt-get install -y kotlin 2>/dev/null || \
          (curl -L https://github.com/JetBrains/kotlin/releases/download/v1.9.23/kotlin-compiler-1.9.23.zip -o /tmp/kotlinc.zip && \
           unzip /tmp/kotlinc.zip -d /opt && echo 'export PATH=$PATH:/opt/kotlinc/bin' >> $GITHUB_ENV))

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build APK
        run: |
          set -e
          APP_DIR="speed-camera-app"
          SRC_DIR="$APP_DIR/app/src/main"
          BUILD_DIR="/tmp/android_build"
          ANDROID_SDK="$ANDROID_HOME"
          BUILD_TOOLS="$ANDROID_SDK/build-tools/34.0.0"
          PLATFORM="$ANDROID_SDK/platforms/android-34"
          KOTLIN_LIB="/usr/share/kotlinc/lib"
          VERSION="${{ steps.version.outputs.version }}"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"/{res,gen,classes_r,dex,apk}

          echo "Compiling resources..."
          $BUILD_TOOLS/aapt2 compile --dir "$SRC_DIR/res" -o "$BUILD_DIR/res/compiled.flata"

          echo "Linking resources..."
          $BUILD_TOOLS/aapt2 link \
            "$BUILD_DIR/res/compiled.flata" \
            -I "$PLATFORM/android.jar" \
            --manifest "$SRC_DIR/AndroidManifest.xml" \
            --java "$BUILD_DIR/gen" \
            -o "$BUILD_DIR/apk/resources.ap_" \
            --auto-add-overlay

          echo "Compiling R.java..."
          javac -cp "$PLATFORM/android.jar" -source 17 -target 17 \
            -d "$BUILD_DIR/classes_r" \
            $(find "$BUILD_DIR/gen" -name "R.java")
          jar -cf "$BUILD_DIR/R.jar" -C "$BUILD_DIR/classes_r" .

          echo "Compiling Kotlin sources..."
          KOTLIN_SOURCES=$(find "$SRC_DIR/kotlin" -name "*.kt" | tr '\n' ' ')
          kotlinc $KOTLIN_SOURCES \
            -classpath "$PLATFORM/android.jar:$KOTLIN_LIB/kotlin-stdlib.jar:$BUILD_DIR/R.jar" \
            -d "$BUILD_DIR/classes_app.jar"

          echo "Converting to DEX..."
          $BUILD_TOOLS/d8 \
            "$BUILD_DIR/classes_app.jar" \
            "$BUILD_DIR/R.jar" \
            "$KOTLIN_LIB/kotlin-stdlib.jar" \
            --lib "$PLATFORM/android.jar" \
            --output "$BUILD_DIR/dex/"

          echo "Assembling APK..."
          cp "$BUILD_DIR/apk/resources.ap_" "$BUILD_DIR/apk/app-unsigned.apk"
          cd "$BUILD_DIR/dex" && zip -j "$BUILD_DIR/apk/app-unsigned.apk" classes.dex
          cd "$SRC_DIR" && zip -r "$BUILD_DIR/apk/app-unsigned.apk" assets/

          echo "Signing APK..."
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12

          $BUILD_TOOLS/apksigner sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "/tmp/FotoradaryPL-v${VERSION}.apk" \
            "$BUILD_DIR/apk/app-unsigned.apk"

          echo "APK_PATH=/tmp/FotoradaryPL-v${VERSION}.apk" >> $GITHUB_ENV
          echo "APK_NAME=FotoradaryPL-v${VERSION}.apk" >> $GITHUB_ENV
          ls -lh "/tmp/FotoradaryPL-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoradaryPL-apk
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Fotoradary PL v${{ steps.version.outputs.version }}
          body: |
            ## 🚗 Fotoradary PL — Speed Camera Warning App for Android

            ### Included Features
            - 📍 **GPS Location Monitoring** — real-time position tracking via foreground service
            - ⚠️ **Speed Camera Alerts** — audio warnings at 1000m, 500m, and 200m
            - 🔊 **Polish TTS Voice** — "Uwaga, fotoradar za 500 metrów, ograniczenie 50 km/h"
            - 🗺️ **15 Polish Camera Locations** — Warsaw, Kraków, Wrocław, Gdańsk, Poznań, motorways A1/A2/S8
            - 🔔 **Persistent Notification** — shows nearest camera distance while monitoring
            - 🚘 **Android Auto ready** — architecture prepared for Car App Library integration

            ### Requirements
            - **Minimum Android version**: Android 8.0 (API 26, Oreo) or newer
            - **Required permissions**:
              - `ACCESS_FINE_LOCATION` — precise GPS positioning
              - `FOREGROUND_SERVICE` — background location monitoring
              - `POST_NOTIFICATIONS` — status notification (Android 13+)

            ### Installation Steps
            1. Download `${{ env.APK_NAME }}` below
            2. On your Android device go to **Settings → Security → Install unknown apps** and allow your browser/Files app
            3. Open the downloaded APK file
            4. Tap **Install**
            5. Grant location and notification permissions when prompted

            ### First-Time Setup
            1. Open **Fotoradary PL**
            2. Tap **▶ Rozpocznij monitoring** (Start monitoring)
            3. Accept all permission requests
            4. The app runs in the background — a notification will show "Monitoring aktywny"
            5. Drive near a camera location and receive voice alerts

            ### Known Limitations
            - Camera database contains 15 sample Polish locations (not exhaustive)
            - No backend sync — database is local/static in this MVP
            - Android Auto UI requires additional Car App Library integration (future release)
            - No speed-direction filtering — alerts fire for cameras regardless of travel direction
            - Signed with debug key — device must allow "Install unknown apps"

          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
